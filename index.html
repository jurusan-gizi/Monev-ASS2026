<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Monev Capaian Gizi ASS – Sulsel</title>
<meta name="theme-color" content="#14A39E">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--merah:#14A39E;--merah-tua:#0B7470;--emas:#B9CE1E;--emas-muda:#F5F9DE;--hijau:#3DB46D;--hijau-muda:#E4F6EA;
  --biru:#3FA9C2;--abu:#F2F7F7;--tosca-muda:#E3F4F3;--side:268px;--teks:#1F2328;--redup:#667085;--garis:#E1E4E8;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--abu);color:var(--teks);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.burger{background:rgba(255,255,255,.18);border:0;color:#fff;width:42px;height:42px;border-radius:12px;font-size:22px;cursor:pointer;flex:0 0 auto}
aside#side{position:fixed;top:0;bottom:0;left:0;width:var(--side);background:#fff;border-right:1px solid var(--garis);z-index:40;
  transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;overflow-y:auto}
aside#side.open{transform:none;box-shadow:4px 0 24px rgba(0,0,0,.15)}
#scrim{position:fixed;inset:0;background:rgba(10,40,40,.35);z-index:35}
.sd-top{background:linear-gradient(160deg,#E3F4F3,#F5F9DE);padding:18px 16px 14px;border-bottom:1px solid var(--garis)}
.sd-logos{display:flex;gap:8px;align-items:center;margin-bottom:10px}.sd-logos img{height:44px;width:auto}
.sd-tim{font-weight:700;color:var(--merah-tua)}.sd-me{font-size:13px;color:var(--redup)}
.sd-nav{padding:10px 10px;display:flex;flex-direction:column;gap:2px}
.sd-nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:11px 12px;border-radius:12px;font-weight:600;font-size:15px;text-align:left;cursor:pointer;color:#344054}
.sd-nav button:hover{background:var(--abu)}
.sd-nav button.on{background:var(--tosca-muda);color:var(--merah-tua)}
.sd-nav button .ic{width:24px;text-align:center;font-size:18px}
.sd-nav hr{border:0;border-top:1px solid var(--garis);margin:8px 4px}
.sd-nav .out{color:#C0392B}
.sd-foot{margin-top:auto;padding:12px 14px 18px;font-size:11.5px;color:var(--redup);text-align:center;line-height:1.5}
@media (min-width:960px){
  aside#side{transform:none}
  #scrim,.burger{display:none!important}
  body.masuk{padding-left:var(--side)}
  body.masuk .navbot{left:var(--side)}
  body.masuk header .logos{display:none}
}
header{background:linear-gradient(120deg,#17AFA9,#0E8C88);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));
  position:sticky;top:0;z-index:10;border-bottom:4px solid var(--emas)}
.hd{display:flex;align-items:center;gap:12px;max-width:760px;margin:auto}
.logos{display:flex;gap:6px;flex:0 0 auto}
.logos img{height:46px;width:auto;background:#fff;border-radius:10px;padding:3px}
.logos img.lp{padding:9px 7px}
.ttl{min-width:0;flex:1}
@media (max-width:400px){.hd{gap:7px}.hd h1{font-size:13px}.logos img{height:38px}.logos img.lp{padding:7px 5px}}
.hd small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd h1{font-size:14.5px;margin:0;line-height:1.2}.hd small{display:block;opacity:.9;font-size:12px;font-weight:400}
.hd .sp{display:none}
.ibtn{background:rgba(255,255,255,.15);border:0;color:#fff;width:40px;height:40px;border-radius:50%;font-size:19px;cursor:pointer}
main{max-width:760px;margin:auto;padding:16px 14px 120px}
.status{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:#fff;border:1px solid var(--garis);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--hijau)}.off .dot{background:#999}
.pill.wait{background:var(--emas-muda);border-color:#F2D27A;color:#7A5A00}.pill.ok{background:var(--hijau-muda);border-color:#A8DDBF;color:#05603A}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn-p{background:var(--merah);color:#fff}.btn-g{background:var(--hijau);color:#fff}.btn-b{background:var(--biru);color:#fff}
.btn-o{background:#fff;border:1.5px solid var(--garis);color:var(--teks)}
.btn-big{width:100%;font-size:17px;padding:16px}
.btn-sm{padding:7px 11px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border-radius:var(--r);padding:16px;border:1px solid var(--garis);margin-bottom:12px}
h2{font-size:15px;margin:22px 0 10px;color:var(--redup);text-transform:uppercase;letter-spacing:.04em}
h3.t{font-size:18px;margin:0 0 8px;color:var(--merah-tua)}
.rec{display:flex;gap:12px;align-items:flex-start}.rec .t{flex:1;min-width:0}.rec b{display:block}.m{font-size:13px;color:var(--redup)}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
.b-draf{background:#EEF0F3;color:#475467}.b-wait{background:var(--emas-muda);color:#7A5A00}.b-ok{background:var(--hijau-muda);color:#05603A}
.w-Hijau{background:#D7F2E2;color:#05603A}.w-Kuning{background:#FFF0B8;color:#7A5A00}.w-Merah{background:#FDE0E0;color:#A0101F}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.empty{text-align:center;color:var(--redup);padding:26px 10px}
label.f{display:block;font-weight:600;font-size:14px;margin:12px 0 5px}
input[type=text],input[type=date],input[type=number],input[type=password],select,textarea{width:100%;padding:11px;border:1.5px solid var(--garis);border-radius:10px;background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--biru);box-shadow:0 0 0 3px rgba(0,114,188,.15)}
textarea{min-height:70px;resize:vertical}
.req::after{content:" *";color:#D0453B}
.hint{font-size:12.5px;color:var(--redup)}
.step-top{display:flex;justify-content:space-between;font-size:13px;color:var(--redup);margin-bottom:6px;gap:8px}
.bar{height:6px;background:var(--garis);border-radius:9px;overflow:hidden;margin-bottom:10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--emas),var(--hijau))}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.chip{flex:0 0 auto;min-width:36px;height:36px;padding:0 8px;border-radius:18px;border:1.5px solid var(--garis);background:#fff;font-weight:700;cursor:pointer;font-size:13px}
.chip.done{background:var(--hijau-muda);border-color:var(--hijau);color:#05603A}.chip.on{background:var(--merah);border-color:var(--merah);color:#fff}
.lb{font-size:12px;font-weight:700;color:#7C8F0E;text-transform:uppercase;letter-spacing:.05em}
.tanya{font-size:13px;color:var(--redup);font-style:italic}
.tpg{display:inline-block;background:var(--tosca-muda);color:var(--merah-tua);font-weight:700;font-size:12px;padding:2px 8px;border-radius:6px;margin:4px 0}
.bukti{background:var(--emas-muda);border-left:4px solid var(--emas);padding:9px 12px;border-radius:8px;font-size:14px;margin-top:8px}
.qbox{margin-top:16px;padding-top:12px;border-top:1px dashed var(--garis)}
.qt{font-size:14.5px;font-weight:600;margin-bottom:6px}.qt b{color:var(--merah)}
.fl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 10px}
.fl.g4{grid-template-columns:1fr 1fr}
.fi label{display:block;font-size:13px;color:#344054;margin-bottom:3px}
.fi .u{font-size:12px;color:var(--redup)}
.fi.wide{grid-column:1/-1}
.calc{padding:10px 11px;border-radius:10px;background:#EEF6FC;border:1.5px dashed #9CC9EA;font-weight:700;min-height:44px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts label{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--garis);border-radius:10px;padding:8px 10px;font-size:14px;cursor:pointer;background:#fff;margin:0;color:var(--teks)}
.opts label:has(input:checked){background:var(--biru);border-color:var(--biru);color:#fff}
.opts input{accent-color:#fff;margin:0}
.warn{background:#FDECEC;color:#A0101F;border-radius:8px;padding:8px 10px;font-size:13.5px;margin-top:10px}
.sec{margin-top:16px;padding-top:12px;border-top:2px solid var(--garis)}
.kamus{border-bottom:1px dotted var(--biru);color:var(--biru);cursor:help}
.navbot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--garis);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:9}
.navbot .in{max-width:760px;margin:auto;display:flex;gap:10px}.navbot .btn{flex:1}
footer{text-align:center;font-size:12px;color:var(--redup);padding:18px 10px 8px;line-height:1.6}footer b{color:var(--merah-tua)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
.modal>.card{max-width:560px;width:100%;margin:0;max-height:92vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:90%;text-align:center}
.mini{border:1px solid var(--garis);border-radius:10px;padding:10px;margin-bottom:10px;background:#FAFBFC}
.mini .hd2{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:4px}
.sigwrap{border:1.5px dashed #9AA4B2;border-radius:10px;background:#fff;position:relative;touch-action:none}
.sigwrap canvas{width:100%;height:150px;display:block}
.sigimg{max-width:100%;height:90px;object-fit:contain;background:#fff;border:1px solid var(--garis);border-radius:8px}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.foto{border:1px solid var(--garis);border-radius:10px;overflow:hidden;background:#fff}
.foto img{width:100%;height:110px;object-fit:cover;display:block}.foto .c{padding:6px}
.sum-item{padding:9px 0;border-bottom:1px solid var(--garis);display:flex;gap:10px;align-items:center;cursor:pointer}
.sum-item .nn{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 auto}
.nn.ok{background:var(--hijau-muda);color:#05603A}.nn.no{background:#EEF1F3;color:#667085}
#printArea{display:none}
@media print{
  @page{size:A4 portrait;margin:12mm}
  body{background:#fff}header,main,.navbot,.toast,.modal,footer{display:none!important}
  #printArea{display:block;font:10pt/1.4 Arial,sans-serif;color:#000}
  #printArea h3{margin:0 0 4px;font-size:13pt;text-align:center}
  #printArea table{width:100%;border-collapse:collapse;margin-top:6px}
  #printArea td,#printArea th{border:1px solid #000;padding:3px 5px;vertical-align:top}
  #printArea th{background:#eee}#printArea tr{page-break-inside:avoid}
  #printArea .noborder td{border:0;padding:1px 4px}
  #printArea img.s{height:60px}
}
</style>
</head>
<body>
<header><div class="hd">
  <button class="burger hide" id="btnMenu" aria-label="Menu">☰</button>
  <div class="logos"><img src="icons/logo-sulsel.png" alt="Logo Sulawesi Selatan"><img src="icons/logo-poltekkes.png" alt="Poltekkes Kemenkes Makassar" class="lp"></div>
  <div class="ttl"><h1>Monev Capaian Gizi ASS<small id="hdSub">Dinas Kesehatan Provinsi Sulawesi Selatan</small></h1></div>
</div></header>
<aside id="side" class="hide"></aside>
<div id="scrim" class="hide"></div>
<main id="app"></main>
<div class="navbot hide" id="navbot"><div class="in" id="navin"></div></div>
<div id="printArea"></div>
<div id="modalRoot"></div>
<script src="config.js?v=9"></script>
<script src="data.js?v=9"></script>
<script src="lib/docx.js?v=9" defer></script>
<script src="app.js?v=9"></script>
<script src="laporan.js?v=9"></script>
</body>
</html>
